name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: incidenthub_test
          POSTGRES_USER: incidenthub
          POSTGRES_PASSWORD: incidenthub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidenthub -d incidenthub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://incidenthub:incidenthub_test_password@localhost:5432/incidenthub_test
      REDIS_URL: redis://localhost:6379
      CLIENT_URL: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build — shared package
        run: npm run build -w packages/shared

      - name: Push database schema
        run: npm run db:push


      - name: Typecheck — shared package
        run: npm run typecheck -w packages/shared

      - name: Typecheck — API
        run: npm run typecheck -w apps/api

      - name: Typecheck — Web
        run: npm run typecheck -w apps/web

      - name: Lint
        run: npm run lint

      - name: Test — API
        run: npm run test -w apps/api

      - name: Build — API
        run: npm run build -w apps/api

      - name: Build — Web
        run: npm run build -w apps/web
